name: Sync shared ledger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Merge the live book into ledger.json
        run: python3 scripts/sync_ledger.py
      - name: Commit the shared book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          if git diff --cached --quiet; then
            echo "No ledger change."
          else
            git commit -m "Update the shared Black Bird ledger"
            git push
          fi
